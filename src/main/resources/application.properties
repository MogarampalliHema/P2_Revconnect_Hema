# ================================================
# RevConnect P2 - Application Configuration
# ================================================

# Server
server.port=8043
server.servlet.context-path=/

# ================================================
# Oracle Database
# ================================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/orcl
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=System
spring.datasource.password=Hema123

# H2 Console (Disabled for Oracle)
spring.h2.console.enabled=false


logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.com.rev.app=DEBUG
# ================================================
# JPA / Hibernate
# ================================================
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=true

# ================================================
# HikariCP Connection Pool (prevent connection exhaustion)
# ================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ================================================
# Thymeleaf
# ================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ================================================
# Spring Security
# ================================================
spring.security.user.name=admin
spring.security.user.password=admin

# ================================================
# File Upload
# ================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Profile picture upload directory
app.upload.dir=uploads/profile-pictures

# ================================================
# Logging (Log4J2)
# ================================================
logging.config=classpath:log4j2.xml
