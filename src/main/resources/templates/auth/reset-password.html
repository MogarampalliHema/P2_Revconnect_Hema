<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password — RevConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <script th:src="@{/js/lucide.min.js}"></script>
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="text-center">
            <div class="auth-logo">
                <i data-lucide="lock" class="icon-lavender" style="width: 32px; height: 32px;"></i>
                <span>Set Password</span>
            </div>
            <p class="auth-tagline">Please create a new, secure password.</p>
        </div>

        <div class="alert alert-error" th:if="${errorMessage}" style="margin-bottom: 1.5rem; text-align: left;">
            <i data-lucide="alert-circle" style="width: 18px;"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <form th:action="@{/forgot-password/reset}" method="post">
            <input type="hidden" name="token" th:value="${token}" />

            <div class="form-group">
                <label class="form-label" for="password">New Password</label>
                <div class="form-control-password-wrapper">
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Minimum 6 characters" required minlength="6" style="padding-right: 3rem;" />
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password')">
                        <i data-lucide="eye" style="width: 18px;"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full mt-4">
                <i data-lucide="check" style="width: 18px; margin-right: 0.5rem;"></i>
                Save Password
            </button>
        </form>
    </div>

    <script>
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const wrapper = input.nextElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                wrapper.innerHTML = '<i data-lucide="eye-off" style="width: 18px;"></i>';
            } else {
                input.type = 'password';
                wrapper.innerHTML = '<i data-lucide="eye" style="width: 18px;"></i>';
            }
            if (window.lucide) window.lucide.createIcons();
        }
        lucide.createIcons();
    </script>
</body>

</html>
