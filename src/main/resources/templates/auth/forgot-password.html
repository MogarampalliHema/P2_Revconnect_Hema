<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password — RevConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <script th:src="@{/js/lucide.min.js}"></script>
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
</head>

<body class="auth-page">
    <div class="auth-card">
        <div class="text-center">
            <div class="auth-logo">
                <i data-lucide="key" class="icon-sky" style="width: 32px; height: 32px;"></i>
                <span>Recover</span>
            </div>
            <p class="auth-tagline">Enter your email to reset your password.</p>
        </div>

        <div class="alert alert-error" th:if="${errorMessage}" style="margin-bottom: 1.5rem; text-align: left;">
            <i data-lucide="alert-circle" style="width: 18px;"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="alert alert-success" th:if="${successMessage}" style="margin-bottom: 1.5rem; text-align: left;">
            <i data-lucide="check-circle" style="width: 18px;"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="form-group">
                <label class="form-label" for="usernameOrEmail">Username or Email</label>
                <input type="text" id="usernameOrEmail" name="usernameOrEmail" class="form-control"
                    placeholder="Enter your registered username or email" required autofocus />
            </div>

            <button type="submit" class="btn btn-primary btn-full mt-4">
                <i data-lucide="send" style="width: 18px; margin-right: 0.5rem;"></i>
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm text-secondary" style="margin-top: 2rem;">
            Remembered your password?
            <a th:href="@{/login}" class="font-bold icon-sky" style="font-weight: 600;">Log in</a>
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>

</html>
